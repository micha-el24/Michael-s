<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudyHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-header">
            <h1>🎓 StudyHub</h1>
            <p>Your journey to academic success starts here.</p>
        </div>

        <form id="loginForm">
            <h2>Welcome Back!</h2>
            <p>Log in to continue learning.</p>

            <label for="loginName">Full Name</label>
            <input type="text" id="loginName" placeholder="Enter your full name" required>

            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit">Log In</button>

            <p class="login-note">
                New to StudyHub?
                <a href="register.html" id="showRegister">Create an account</a>
            </p>

            <p id="loginMessage" role="status"></p>
        </form>

    </div>

</body>

<script src="script.js"></script>

</html>
